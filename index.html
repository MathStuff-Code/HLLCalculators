<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortar Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .calculator {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #0069d9;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 12px;
        }

        .result-label {
            color: #666;
            font-size: 16px;
        }

        #angle {
            font-size: 48px;
            font-weight: bold;
            color: #007bff;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Mortar Calculator, </h1>

        <p class="description">
            Enter a distance in meters to calculate the angle.
        </p>

        <label for="meters">Meters</label>

        <input
            type="number"
            id="meters"
            placeholder="Enter meters"
            step="any"
            onkeydown="if(event.key === 'Enter') calculate()"
        >

        <button onclick="calculate()">Calculate</button>

        <div class="result">
            <div class="result-label">Angle</div>
            <div id="angle">--°</div>
        </div>

    </div>

    <script>
        function calculate() {
    const meters = parseFloat(
        document.getElementById("meters").value
    );

    const angleElement = document.getElementById("angle");

    if (isNaN(meters)) {
        angleElement.textContent = "--°";
        return;
    }

    if (meters > 450) {
        angleElement.textContent = "Too Far";
        return;
    }

    if (meters < 100) {
        angleElement.textContent = "Too Close";
        return;
    }

    const result = -0.24 * meters + 108;

    angleElement.textContent = Math.round(result) + "°";
}

    </script>

</body>
</html>
